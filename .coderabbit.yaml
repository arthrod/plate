# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for arthrod/plate fork.
# Tuned for: TypeScript monorepo (pnpm + turbo), advisory-only review,
# noisy generated/CI-controlled paths excluded.

language: "en-US"
early_access: false
tone_instructions: |
  Be terse. Sacrifice grammar for concision. Cite file:line. No filler.
  Flag scope creep loudly: a bug fix should not refactor surrounding code.
  Plate is Slate-first — call out plugin work that starts in src/react when
  semantics could live in src/lib.

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true
  labeling_instructions:
    - label: "performance"
      instructions: "Apply when changes touch hot paths, bundle size, render frequency, or normalize/decoration loops."
    - label: "documentation"
      instructions: "Apply when only docs, JSDoc, or .agents/rules/*.mdc change."
  path_filters:
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/package-lock.json"
    - "!**/dist/**"
    - "!**/.turbo/**"
    - "!**/.next/**"
    - "!**/.contentlayer/**"
    - "!**/node_modules/**"
    - "!**/coverage/**"
    - "!**/*.tsbuildinfo"
    - "!**/__snapshots__/**"
    - "!**/*.snap"
    - "!templates/**"
    - "!apps/www/public/r/**"
    - "!apps/www/.contentlayer/**"
    - "!**/CHANGELOG.md"
  path_instructions:
    - path: "packages/**/src/lib/**/*.{ts,tsx}"
      instructions: |
        Slate-first lane. Forbid: any, SlateEditor parameter annotations when
        plugin context already provides editor, hardcoded plugin-key string
        literals (use KEYS from packages/utils/src/lib/plate-keys.ts),
        re-authoring base plugins via createPlatePlugin (use toPlatePlugin).
        Helpers/fallbacks/internal logic must live under internal/ — only
        true public API at top level. Prefer createTSlatePlugin only when
        explicit contract control is needed; otherwise createSlatePlugin
        with inference.
    - path: "packages/**/src/react/**/*.{ts,tsx}"
      instructions: |
        Plate/React wrapper lane. Lift base plugins via toPlatePlugin /
        toTPlatePlugin instead of redefining semantics. Use inject.nodeProps
        .transformProps for prop augmentation that needs hooks before
        inventing wrapper components. Never duplicate KEYS as string
        literals. Read-only behavior must respect editOnly config on the
        base plugin.
    - path: "packages/**/src/**/index.{ts,tsx}"
      instructions: |
        Barrels are GENERATED by `pnpm brl`. Flag any hand-edit. If a PR
        adds/moves/renames public files under exported folders, the same PR
        must include a regenerated barrel.
    - path: "packages/**/src/**/*.spec.{ts,tsx}"
      instructions: |
        Bun test runner. Co-located *.spec.ts. Forbid TDD cases for dead
        code/legacy removal assertions ("should not contain old API X
        anymore") — those should remove the dead path directly, not test
        for its absence.
    - path: ".changeset/*.md"
      instructions: |
        Verify version bump matches scope: new package = minor, breaking =
        major, internal-only = patch. Summary must describe user-facing
        change, not implementation.
    - path: "apps/www/content/docs/**/*.{md,mdx}"
      instructions: |
        Docs are user-facing reference for the LATEST state only. Reject
        changelog-style language: "has been removed", "new feature",
        "previously", "now supports". Write as if no prior version exists.
        No migration notes.
    - path: ".agents/AGENTS.md"
      instructions: |
        Source of truth for agent rules. After edits, `pnpm install` must
        sync the SKILL.md mirror; flag PRs that touch AGENTS.md without
        the mirror update.
    - path: ".agents/rules/*.mdc"
      instructions: |
        Source of truth for agent skill rules. Same sync requirement as
        AGENTS.md.
    - path: "templates/**"
      instructions: |
        CI-controlled output. Reject manual edits unconditionally. Fix
        the source registry/package and let CI regenerate.
  abort_on_close: true
  auto_review:
    enabled: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "[skip ci]"
      - "[skip release]"
    drafts: false
    base_branches:
      - "main"
      - "codex/.*"
  finishing_touches:
    docstrings:
      enabled: true

chat:
  auto_reply: true
  integrations:
    jira:
      usage: "disabled"
    linear:
      usage: "disabled"

knowledge_base:
  opt_out: false
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  pull_requests:
    scope: "auto"
