name: PR Title Validation

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: read
  statuses: write

jobs:
  validate-title:
    name: Validate PR title (conventional commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            perf
            test
            build
            revert
          # Allow release PRs created by changesets
          ignoreLabels: |
            release
          # Scopes are optional but allowed (e.g. feat(pagination): ...)
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the expected pattern. Please use lowercase for the subject.
          # Ignore bot release PRs
          ignorePattern: '^\[Release\]'
